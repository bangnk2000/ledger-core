# Git Branching Workflow Extension Configuration
# Copied to .specify/extensions/git/git-config.yml on install

# Branch numbering strategy: "sequential" (001, 002, ...) or "timestamp" (YYYYMMDD-HHMMSS)
branch_numbering: sequential

# Commit message used by `git commit` during repository initialization
init_commit_message: "chore(spec-kit): initialize project"

# Auto-commit before/after core commands.
# Set "default" to enable for all commands, then override per-command.
# Each key can be true/false. Message is customizable per-command.
auto_commit:
  default: true
  before_clarify:
    enabled: true
    message: "chore(spec-kit): save progress before clarification"
  before_plan:
    enabled: true
    message: "chore(spec-kit): save progress before planning"
  before_tasks:
    enabled: true
    message: "chore(spec-kit): save progress before task generation"
  before_implement:
    enabled: true
    message: "chore(spec-kit): save progress before implementation"
  before_checklist:
    enabled: true
    message: "chore(spec-kit): save progress before checklist"
  before_analyze:
    enabled: true
    message: "chore(spec-kit): save progress before analysis"
  before_taskstoissues:
    enabled: true
    message: "chore(spec-kit): save progress before issue sync"
  after_constitution:
    enabled: true
    message: "docs(constitution): update project governance"
  after_specify:
    enabled: true
    message: "docs(spec): add feature specification"
  after_clarify:
    enabled: true
    message: "docs(spec): clarify feature specification"
  after_plan:
    enabled: true
    message: "docs(plan): add implementation plan"
  after_tasks:
    enabled: true
    message: "docs(tasks): add implementation tasks"
  after_implement:
    enabled: true
    message: "feat: implement feature progress"
  after_checklist:
    enabled: true
    message: "docs(checklist): add feature checklist"
  after_analyze:
    enabled: true
    message: "docs(analysis): add feature analysis report"
  after_taskstoissues:
    enabled: true
    message: "docs(tasks): sync tasks to issues"
